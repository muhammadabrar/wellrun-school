services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: wellrun
      POSTGRES_PASSWORD: wellrun
      POSTGRES_DB: wellrun_school
    volumes:
      - wellrun_pg:/var/lib/postgresql/data

volumes:
  wellrun_pg:
